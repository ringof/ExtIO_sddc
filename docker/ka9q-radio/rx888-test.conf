# Minimal ka9q-radio config for RX888mk2 firmware compatibility testing
# Usage: radiod -f /etc/radio/radiod@rx888-test.conf

[global]
hardware = rx888
status = hf.local
samprate = 12k
mode = usb

[rx888]
device = "rx888"
description = "rx888 firmware test"
samprate = 64m8
gain = 10
dither = no
rand = no
firmware = /firmware/SDDC_FX3.img
# The rx888 driver can issue a libusb_reset_device() during init. This
# firmware treats a USB reset as a reboot-to-DFU, so that reset drops the
# device to bootloader and breaks radiod init.
#
# At the pinned ka9q-radio SHA the old `hack_no_usb_reset` key is gone,
# replaced by `reset` (default false). false IS the safe value for this
# firmware, so the reset no longer fires by default; we set it explicitly to
# document intent. (Setting the retired `hack_no_usb_reset` here would now
# only produce an unknown-key warning from config_validate_section.)
reset = no

# Tune to WWV 10 MHz as a quick sanity check
[WWV]
data = wwv-pcm.local
mode = am
freq = "5000k 10000k 15000k"
