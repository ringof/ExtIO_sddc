# Minimal ka9q-radio config for RX888mk2 firmware compatibility testing
# Usage: radiod -f /etc/radio/radiod@rx888-test.conf

[global]
hardware = rx888
status = hf.local
samprate = 12k
mode = usb

[rx888]
device = "rx888"
description = "rx888 firmware test"
samprate = 64m8
gain = 10
dither = no
rand = no
firmware = /firmware/SDDC_FX3.img
# The newer ka9q rx888 driver does a libusb_reset_device() during init
# ("in case it was left running"). This firmware treats a USB reset as a
# reboot-to-DFU, so that reset drops the device to bootloader and breaks
# radiod init. KA9Q's own key description: "Don't reset USB device after
# sending the STOPFX3 command--the reset seems to break alternate FX3
# firmware." Skip it.
hack_no_usb_reset = yes

# Tune to WWV 10 MHz as a quick sanity check
[WWV]
data = wwv-pcm.local
mode = am
freq = "5000k 10000k 15000k"
