# ka9q-radio config for RX888mk2 firmware compatibility + bench testing
# Usage: radiod -f /etc/radio/radiod@rx888-test.conf
#
# ADC sample rate is set by the entrypoint via ADC_SAMPRATE env var
# (default 64m8; set ADC_SAMPRATE=129m6 for full-rate if thermal allows).

[global]
hardware = rx888
status = hf.local
samprate = 12k
mode = usb
# ttl = 0 keeps multicast local (no LAN leak from a test container)
ttl = 0

[rx888]
device = "rx888"
description = "rx888 firmware test"
# ADC_SAMPRATE placeholder — entrypoint substitutes this at startup.
# 64m8 (64.8 Msps, default) or 129m6 (129.6 Msps, full-rate).
# Both are integer multiples of 27 MHz ×(12/5) and ×(24/5), so the
# Si5351 PLL solver produces clean solutions with low phase noise.
samprate = 64m8
gain = 0
att = 31.5
dither = no
rand = no
firmware = /firmware/SDDC_FX3.img
# The rx888 driver can issue a libusb_reset_device() during init. This
# firmware treats a USB reset as a reboot-to-DFU, so that reset drops the
# device to bootloader and breaks radiod init.
#
# At the pinned ka9q-radio SHA the old `hack_no_usb_reset` key is gone,
# replaced by `reset` (default false). false IS the safe value for this
# firmware, so the reset no longer fires by default; we set it explicitly to
# document intent. (Setting the retired `hack_no_usb_reset` here would now
# only produce an unknown-key warning from config_validate_section.)
reset = no

# --- Reference channels (always-on sanity check) -----------------------

[WWV]
data = wwv-pcm.local
mode = am
freq = "5000k 10000k 15000k"

# --- FT8 channels — 80/40/30/20 m (QDX band coverage) ------------------
# Dial frequencies per WSJT-X / PSKReporter convention.
# 12 kHz output sample rate (inherited from [global]) matches decode_ft8.
# Data group: ft8-pcm.local — bench scripts capture from this group.

[FT8]
data = ft8-pcm.local
mode = usb
freq = "3m573000 7m074000 10m136000 14m074000"

# --- WSPR channels — 80/40/30/20 m (QDX band coverage) -----------------
# Dial frequencies per wsprdaemon / WSPRnet convention (200 Hz TX window
# centered at dial + 1500 Hz).
# 12 kHz output sample rate (inherited from [global]) matches wsprd.
# Data group: wspr-pcm.local — bench scripts capture from this group.

[WSPR]
data = wspr-pcm.local
mode = usb
freq = "3m568600 7m038600 10m138700 14m095600"
