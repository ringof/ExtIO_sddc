# Minimal ka9q-radio config for RX888mk2 firmware compatibility testing
# Usage: radiod -f /etc/radio/radiod@rx888-test.conf

[global]
hardware = rx888
status = hf.local
samprate = 12k
mode = usb

[rx888]
device = "rx888"
description = "rx888 firmware test"
samprate = 64m8
gain = 10
dither = no
rand = no
firmware = /firmware/SDDC_FX3.img
# At this ka9q-radio (6a5094ac, 2026-05-02) the rx888 driver's init-time
# USB reset defaults OFF (config key `reset`, default false). This firmware
# reboots to the bootloader on a USB reset, which the old default-on reset
# broke; pre-6a5094ac builds needed `hack_no_usb_reset = yes`. Now: just
# leave `reset` unset (off) — no workaround required.

# Tune to WWV 10 MHz as a quick sanity check
[WWV]
data = wwv-pcm.local
mode = am
freq = "5000k 10000k 15000k"
