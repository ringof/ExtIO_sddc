# ka9q-radio config: RX888mk2 VHF FM-broadcast test (R828D front-end)
#
# Pairs with the host-side tuner vhf_tune.py / vhf_fm_tune.sh. radiod drives the
# RX888 over its normal direct-sampling path and OWNS the ADC sample clock
# (Si5351 CLKA / CLK0). Separately, vhf_fm_tune.sh tunes the R828D VHF front-end
# over EP0 — it flips VHF_EN, programs CLKB (CLK2) = 16 MHz tuner reference, and
# sets the R828D PLL, WITHOUT touching CLKA. So it runs concurrently with this
# radiod (the two-actor / EP0-control-vs-EP1-bulk model).
#
# Signal path once VHF is engaged:
#   FM station at RF  --R828D-->  IF centre 4.570 MHz  --ADC-->  this radiod
#   LO = RF + 4.57 MHz, so the station you tune the R828D to lands at 4570 kHz.
# The WBFM receiver below is parked at 4570 kHz to demod that station. The
# R828D's 8 MHz IF filter also passes its neighbours (~4.57 MHz +/- 4 MHz), so
# you can retune THIS channel across the captured window with `control hf.local`
# or `tune` to hop between stations without re-tuning the front end.
#
#   Launch:  ./docker/ka9q-radio/ka9q.sh start --vhf
#   Tune:    ./vhf_fm_tune.sh 100300000          # bring 100.3 MHz to 4.57 MHz IF
#   Listen:  ./docker/ka9q-radio/ka9q.sh monitor fm-pcm.local
#
# NOTE (wisdom): the WBFM channel runs a 384 kHz output rate, a different FFT
# size than the HF test config's 12 kHz — first launch regenerates FFTW wisdom
# for it (cached in the wisdom volume thereafter). The input FFT (rof1620000,
# from the unchanged 64.8 MHz ADC rate) is reused.
#
# NOTE (GPIO): radiod sets the GPIO word once at init (HF, VHF_EN clear);
# vhf_fm_tune.sh then ORs VHF_EN onto the live word. Don't toggle dither/rand in
# ka9q after tuning VHF — radiod would rewrite the whole GPIO word and clear
# VHF_EN. Re-run vhf_fm_tune.sh if that happens.

[global]
hardware = rx888
status = hf.local
samprate = 384k
mode = wfm

[rx888]
device = "rx888"
description = "rx888 VHF FM test"
samprate = 64m8
gain = 10
dither = no
rand = no
firmware = /firmware/SDDC_FX3.img
# See rx888-test.conf: this firmware treats a USB reset as reboot-to-DFU, so the
# newer ka9q driver's init-time libusb_reset_device() would drop it to the
# bootloader. Skip it.
hack_no_usb_reset = yes

# WBFM receiver parked at the R828D IF centre (4.570 MHz = IF_CARRIER in
# vhf_tune.py). Tune the R828D so the desired FM station lands here, or retune
# this channel within the ~8 MHz captured window to pick neighbours.
[FM-BCB]
data = fm-pcm.local
mode = wfm
samprate = 384k
freq = "4570k"
